    <script>
      // Apply the theme before the first paint to avoid a flash (see core/theme).
      // data-theme="system" follows the OS until the user picks light or dark.
      try {
        var t = localStorage.getItem('ootd.theme');
        document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : 'system';
      } catch (e) {
        document.documentElement.dataset.theme = 'system';
      }
    </script>
